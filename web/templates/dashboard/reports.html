{% extends "base.html" %}
{% block title %}리포트{% endblock %}
{% block page_title %}리포트 다운로드{% endblock %}

{% block content %}

<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
  <div class="px-6 py-4 border-b border-gray-100">
    <h2 class="font-semibold text-gray-800">엑셀 리포트 목록</h2>
  </div>

  <table class="w-full text-sm">
    <thead class="bg-gray-50 text-gray-500 text-xs">
      <tr>
        <th class="px-6 py-3 text-left">파일명</th>
        <th class="px-6 py-3 text-center w-32">다운로드</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-50">
      {% for fname in reports %}
      <tr class="hover:bg-gray-50">
        <td class="px-6 py-3">
          <div class="flex items-center gap-2">
            <span class="text-green-500">📊</span>
            <span class="font-medium">{{ fname }}</span>
          </div>
        </td>
        <td class="px-6 py-3 text-center">
          <a href="/reports/download/{{ fname }}"
            class="inline-flex items-center gap-1 bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-semibold px-3 py-1.5 rounded-lg transition">
            ⬇ 다운로드
          </a>
        </td>
      </tr>
      {% else %}
      <tr>
        <td colspan="2" class="px-6 py-10 text-center text-gray-400">
          생성된 리포트가 없습니다
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

{% endblock %}
