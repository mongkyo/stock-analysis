{% extends "base.html" %}
{% block title %}관심종목{% endblock %}
{% block page_title %}관심종목{% endblock %}

{% block content %}

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

  <!-- 종목 추가 폼 -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 px-6 py-6 h-fit">
    <h2 class="font-semibold text-gray-800 mb-4">종목 추가</h2>
    <form
      hx-post="/watchlist"
      hx-target="#watchlist-body"
      hx-swap="innerHTML"
      class="space-y-3"
    >
      <div>
        <label class="block text-xs text-gray-500 mb-1">종목코드</label>
        <input type="text" name="code" required maxlength="6" placeholder="005930"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">종목명</label>
        <input type="text" name="name" required placeholder="삼성전자"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>
      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-semibold transition">
        추가
      </button>
    </form>
  </div>

  <!-- 관심종목 목록 -->
  <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-100">
      <h2 class="font-semibold text-gray-800">내 관심종목</h2>
    </div>
    <div id="watchlist-body">
      {% include "watchlist/partials/list.html" %}
    </div>
  </div>

</div>

{% endblock %}
