<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}주식 분석 플랫폼{% endblock %}</title>
  <!-- Tailwind CSS CDN (개발용) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <!-- Alpine.js -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
    .htmx-request .htmx-indicator { opacity: 1; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

<!-- 사이드바 + 헤더 레이아웃 -->
<div class="flex h-screen overflow-hidden">

  <!-- 사이드바 -->
  <aside class="w-56 bg-gray-900 text-white flex flex-col flex-shrink-0">
    <div class="px-6 py-5 border-b border-gray-700">
      <span class="text-lg font-bold tracking-wide">📈 StockPlatform</span>
    </div>
    <nav class="flex-1 px-4 py-6 space-y-1 text-sm">
      <a href="/" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-700 {% if request.url.path == '/' %}bg-gray-700{% endif %}">
        🏠 대시보드
      </a>
      <a href="/analysis" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-700 {% if '/analysis' in request.url.path %}bg-gray-700{% endif %}">
        📊 Top100 분석
      </a>
      <a href="/watchlist" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-700 {% if '/watchlist' in request.url.path %}bg-gray-700{% endif %}">
        ⭐ 관심종목
      </a>
      <a href="/reports" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-700 {% if '/reports' in request.url.path %}bg-gray-700{% endif %}">
        📁 리포트
      </a>
      {% if user.role == 'admin' %}
      <div class="border-t border-gray-700 my-2"></div>
      <a href="/admin/users" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-700 {% if '/admin' in request.url.path %}bg-gray-700{% endif %}">
        ⚙️ 회원 관리
      </a>
      {% endif %}
    </nav>
    <div class="px-4 py-4 border-t border-gray-700 text-xs text-gray-400">
      <div class="mb-1">{{ user.username }} ({{ user.role }})</div>
      <a href="/auth/logout" class="hover:text-white">로그아웃</a>
    </div>
  </aside>

  <!-- 메인 영역 -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between">
      <h1 class="text-xl font-semibold">{% block page_title %}{% endblock %}</h1>
      <span class="text-sm text-gray-500">오늘: {{ now.strftime('%Y.%m.%d') if now is defined else '' }}</span>
    </header>

    <!-- 페이지 본문 -->
    <main class="flex-1 overflow-y-auto px-8 py-6">
      {% block content %}{% endblock %}
    </main>
  </div>

</div>

</body>
</html>
