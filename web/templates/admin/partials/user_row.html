<!-- HTMX 부분 렌더링: 회원 행 (승인/권한변경/비활성화 후 교체) -->
<tr id="user-all-{{ u.id }}">
  <td class="px-4 py-3">{{ u.name or '—' }}</td>
  <td class="px-4 py-3 font-medium">{{ u.username }}</td>
  <td class="px-4 py-3 text-gray-500">{{ u.email }}</td>
  <td class="px-4 py-3 text-center">
    <span class="px-2 py-1 rounded-full text-xs font-medium
      {% if u.role == 'admin' %}bg-purple-100 text-purple-700
      {% elif u.role == 'premium' %}bg-blue-100 text-blue-700
      {% else %}bg-gray-100 text-gray-600{% endif %}">
      {{ u.role }}
    </span>
  </td>
  <td class="px-4 py-3 text-center">
    {% if u.is_active %}
    <span class="text-green-600 text-xs font-medium">활성</span>
    {% else %}
    <span class="text-gray-400 text-xs">대기</span>
    {% endif %}
  </td>
  <td class="px-4 py-3 text-center text-xs text-gray-400">{{ u.auth_provider }}</td>
  <td class="px-4 py-3 text-center">
    {% if u.role != 'admin' %}
    <div class="flex items-center justify-center gap-1">
      <select id="role-all-{{ u.id }}" class="border border-gray-300 rounded px-1.5 py-1 text-xs">
        <option value="basic" {% if u.role == 'basic' %}selected{% endif %}>basic</option>
        <option value="premium" {% if u.role == 'premium' %}selected{% endif %}>premium</option>
      </select>
      <button
        hx-post="/admin/users/{{ u.id }}/role"
        hx-vals='js:{"role": document.getElementById("role-all-{{ u.id }}").value}'
        hx-target="#user-all-{{ u.id }}"
        hx-swap="outerHTML"
        class="bg-blue-500 hover:bg-blue-600 text-white text-xs px-2 py-1 rounded transition">
        변경
      </button>
      {% if u.is_active %}
      <button
        hx-post="/admin/users/{{ u.id }}/deactivate"
        hx-target="#user-all-{{ u.id }}"
        hx-swap="outerHTML"
        hx-confirm="{{ u.username }}을(를) 비활성화할까요?"
        class="bg-red-100 hover:bg-red-200 text-red-600 text-xs px-2 py-1 rounded transition">
        정지
      </button>
      {% else %}
      <button
        hx-post="/admin/users/{{ u.id }}/approve"
        hx-vals='js:{"role": document.getElementById("role-all-{{ u.id }}").value}'
        hx-target="#user-all-{{ u.id }}"
        hx-swap="outerHTML"
        class="bg-green-100 hover:bg-green-200 text-green-600 text-xs px-2 py-1 rounded transition">
        활성화
      </button>
      {% endif %}
    </div>
    {% else %}
    <span class="text-xs text-gray-300">—</span>
    {% endif %}
  </td>
</tr>
