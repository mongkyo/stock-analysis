<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>로그인 — 주식 분석 플랫폼</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center">

<div class="w-full max-w-sm">
  <div class="text-center mb-8">
    <div class="text-5xl mb-3">📈</div>
    <h1 class="text-2xl font-bold text-white">StockPlatform</h1>
    <p class="text-gray-400 text-sm mt-1">한국 주식 분석 플랫폼</p>
  </div>

  <div class="bg-white rounded-2xl shadow-xl px-8 py-8">
    {% if error %}
    <div class="mb-4 px-4 py-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/auth/login" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">아이디</label>
        <input
          type="text" name="username" required autofocus
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="아이디를 입력하세요"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">비밀번호</label>
        <input
          type="password" name="password" required
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="비밀번호를 입력하세요"
        />
      </div>
      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition"
      >
        로그인
      </button>
    </form>
  </div>
</div>

</body>
</html>
