<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>회원가입 — 주식 분석 플랫폼</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center">

<div class="w-full max-w-sm">
  <div class="text-center mb-8">
    <div class="text-5xl mb-3">📈</div>
    <h1 class="text-2xl font-bold text-white">StockPlatform</h1>
    <p class="text-gray-400 text-sm mt-1">회원가입</p>
  </div>

  <div class="bg-white rounded-2xl shadow-xl px-8 py-8">
    {% if error %}
    <div class="mb-4 px-4 py-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/auth/register" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">이름</label>
        <input type="text" name="name" required
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="홍길동"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">아이디</label>
        <input type="text" name="username" required maxlength="50"
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="아이디 (영문/숫자)"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">이메일</label>
        <input type="email" name="email" required
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="example@email.com"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">비밀번호</label>
        <input type="password" name="password" required minlength="8"
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="8자 이상"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">비밀번호 확인</label>
        <input type="password" name="password_confirm" required
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="비밀번호 재입력"/>
      </div>
      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition">
        가입 신청
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
      이미 계정이 있으신가요?
      <a href="/auth/login" class="text-blue-600 hover:underline">로그인</a>
    </p>
  </div>

  <p class="text-center text-xs text-gray-500 mt-4">
    가입 후 관리자 승인이 필요합니다
  </p>
</div>

</body>
</html>
