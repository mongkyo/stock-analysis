name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted  # 맥북프로에 등록된 runner

    steps:
      - name: 코드 최신화
        run: |
          cd /Users/mongkyo-server/Developer/stock-analysis
          git pull origin main

      - name: 패키지 설치
        run: |
          cd /Users/mongkyo-server/Developer/stock-analysis
          pip3 install -r requirements.txt --quiet

      - name: DB 마이그레이션
        run: |
          cd /Users/mongkyo-server/Developer/stock-analysis/web
          /usr/local/bin/python3.11 -m alembic upgrade head

      - name: 웹 서버 재시작
        run: |
          launchctl stop com.stock.uvicorn || true
          sleep 1
          launchctl start com.stock.uvicorn

      - name: 스케줄러 launchd 등록 및 재시작
        run: |
          mkdir -p ~/logs
          PLIST=~/Library/LaunchAgents/com.stock.scheduler.plist
          # 최초 1회: plist 복사 후 load
          if ! launchctl list | grep -q com.stock.scheduler; then
            cp /Users/mongkyo-server/Developer/stock-analysis/launchd/com.stock.scheduler.plist "$PLIST"
            launchctl load "$PLIST"
            echo "✅ 스케줄러 최초 등록 완료"
          else
            launchctl stop com.stock.scheduler || true
            sleep 1
            launchctl start com.stock.scheduler
            echo "✅ 스케줄러 재시작 완료"
          fi

      - name: 배포 완료 확인
        run: |
          sleep 3
          curl -sf http://localhost:8000/auth/login > /dev/null \
            && echo "✅ 서버 정상 응답" \
            || echo "⚠️ 서버 응답 없음 — 로그 확인 필요"
